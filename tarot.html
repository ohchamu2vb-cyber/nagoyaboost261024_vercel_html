        <div class="symbol">☾</div>
        <div class="card-title">YOUR TAROT</div>

      advice: "目標を具体的にして、できることから順番に進めましょう。"
    };

    // 22枚の大アルカナを正しく並べる
    cards[4] = {
      name: "皇帝", symbol: "👑",
      meaning: "安定、責任、秩序。地に足をつけて行動することが成果につながります。",
      reversed: "頑固さや支配欲に注意。自分にも相手にも余白を持たせましょう。",
      love: "誠実な態度が信頼を育てます。言葉だけでなく行動を大切に。",
      loveReversed: "相手を思い通りにしようとしていないか、自分の希望を整理してみて。",
      advice: "目標を具体的にして、できることから順番に進めましょう。"
    };

    const cardElement = document.getElementById("card");
    const resultElement = document.getElementById("result");
    const drawButton = document.getElementById("drawButton");

    function drawCard() {
      const question = document.getElementById("userQuestion").value.trim();
      const card = cards[Math.floor(Math.random() * cards.length)];
      const isReversed = Math.random() < 0.5;
      const orientation = isReversed ? "逆位置" : "正位置";

      cardElement.className = "card";
      cardElement.innerHTML = `
        <div class="card-number">${isReversed ? "REVERSED" : "UPRIGHT"}</div>
        <div class="symbol">${card.symbol}</div>
        <div class="card-title">${card.name}</div>
        <div class="orientation">${orientation}</div>
      `;

      if (isReversed) {
        cardElement.querySelector(".symbol").classList.add("reversed");
      }

      document.getElementById("resultQuestion").textContent =
        question ? `あなたの質問：${question}` : "今のあなたへのメッセージ";

      document.getElementById("resultTitle").textContent =
        `${card.name}（${orientation}）`;

      document.getElementById("resultSubtitle").textContent =
        isReversed ? "逆位置のカードが示すヒント" : "正位置のカードが示すヒント";

      document.getElementById("meaning").textContent =
        isReversed ? card.reversed : card.meaning;

      document.getElementById("love").textContent =
        isReversed ? card.loveReversed : card.love;

      document.getElementById("advice").textContent = card.advice;

      resultElement.style.display = "block";
      resultElement.style.animation = "none";
      void resultElement.offsetWidth;
      resultElement.style.animation = "fadeIn 0.6s ease";

      drawButton.textContent = "もう一度カードを引く ✨";

      resultElement.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    drawButton.addEventListener("click", drawCard);
  </script>
</body>
</html>
